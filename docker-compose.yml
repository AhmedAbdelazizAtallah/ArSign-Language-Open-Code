version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: asl-backend
    environment:
      - ENVIRONMENT=production
      - MODEL_PATH=/app/models/best.onnx
      - USE_GPU=${USE_GPU:-false}
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=https://${FRONTEND_DOMAIN:-localhost:3000}
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - asl-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asl-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asl-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: asl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - asl-network

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: asl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - asl-network

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: asl-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - asl-network

networks:
  asl-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data: